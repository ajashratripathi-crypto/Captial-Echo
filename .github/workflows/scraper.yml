name: Capital-Echo Data Engine

on:
  schedule:
    # Every 30 minutes
    - cron: "*/30 * * * *"

  # Adds a manual "Run workflow" button
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance supabase requests beautifulsoup4 lxml pdfplumber

      - name: Run Capital-Echo Data Engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python backend/scraper.py
